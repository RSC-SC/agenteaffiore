# CI — Agente de Chat Affiore
#
# Três etapas independentes (lint, testes, build) mais a validação da imagem.
# A suíte é 100% offline por construção: os provedores de LLM são mockados,
# então NENHUM segredo é necessário no pipeline — o que reduz a superfície de
# de ataque do próprio CI.
#
# Fluxo de branches conforme AGENTS.md: feature/* -> develop -> main.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Verificar código com ruff
        run: |
          set -o pipefail
          python -m ruff check . 2>&1 | tee lint_output.txt

      - name: Salvar log do lint como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-lint
          path: lint_output.txt

  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar suíte offline com cobertura
        run: |
          set -o pipefail
          python -m pytest tests -v --cov=src --cov=api --cov-report=term-missing 2>&1 | tee pytest_output.txt

      - name: Salvar log dos testes como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-pytest
          path: pytest_output.txt

  build:
    name: Build e validação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências de produção
        run: pip install -r requirements.txt

      - name: Byte-compilar todos os módulos
        run: |
          set -o pipefail
          python -m compileall -q src api.py main.py 2>&1 | tee build_output.txt

      - name: Smoke de importação (grafo compila sem rede/chaves)
        run: |
          set -o pipefail
          python -c "
          from src.graph import build_graph
          grafo = build_graph()
          print('Grafo compilado:', type(grafo).__name__)
          print('Nos:', sorted(grafo.get_graph().nodes))
          " 2>&1 | tee -a build_output.txt

      - name: Smoke da API (rotas registradas sem rede)
        run: |
          set -o pipefail
          python -c "
          import api
          rotas = sorted(r.path for r in api.app.routes if hasattr(r, 'path') and not r.path.startswith('/openapi'))
          print('Rotas:', rotas)
          assert '/chat' in rotas and '/health' in rotas
          " 2>&1 | tee -a build_output.txt

      - name: Validar Dockerfile (build da imagem)
        run: |
          set -o pipefail
          docker build -t affiore-chat:ci . 2>&1 | tee -a build_output.txt

      - name: Salvar log do build como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-build
          path: build_output.txt