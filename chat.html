<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Affiore - Teste do Agente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 12px; }
    
    .chat-container { width: 100%; max-width: 520px; height: 92vh; background: #ffffff; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
    
    /* Configurações da API */
    .config-bar { background: #f8f9fa; padding: 8px 12px; border-bottom: 1px solid #e9ecef; font-size: 11px; display: flex; gap: 8px; flex-wrap: wrap; }
    .config-bar input { flex: 1; min-width: 140px; padding: 4px 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 11px; }
    .config-bar button { padding: 4px 8px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; }
    
    /* Cabeçalho */
    .header { background: #4a3427; color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
    .header h2 { font-size: 16px; font-weight: 600; }
    .status-dot { width: 8px; height: 8px; background: #25d366; border-radius: 50%; display: inline-block; margin-right: 6px; }

    /* Área de mensagens */
    .messages-area { flex: 1; padding: 16px; overflow-y: auto; background: #e5ddd5; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 13.5px; line-height: 1.45; word-wrap: break-word; white-space: pre-wrap; }
    .msg-user { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
    .msg-bot { align-self: flex-start; background: #ffffff; border-bottom-left-radius: 2px; box-shadow: 0 1px 1px rgba(0,0,0,0.06); }
    .msg-system { align-self: center; background: #fff3cd; color: #856404; font-size: 11px; border-radius: 12px; padding: 4px 10px; }
    
    /* Área de entrada */
    .input-area { display: flex; padding: 10px; background: #f0f0f0; gap: 8px; border-top: 1px solid #ddd; }
    .input-area textarea { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; resize: none; height: 42px; font-size: 13px; }
    .input-area button { background: #4a3427; color: white; border: none; padding: 0 16px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; }
    .input-area button:disabled { background: #aaa; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="chat-container">
  <!-- Painel de Configuração de Rede -->
  <div class="config-bar">
    <input type="text" id="apiUrl" value="http://localhost:8000/chat" title="URL do endpoint /chat">
    <input type="text" id="sessionId" value="teste_browser_01" title="Session ID">
    <input type="password" id="authToken" placeholder="API token" title="API_AUTH_TOKEN (Bearer)">
    <button onclick="resetSession()" title="Limpa a memória da sessão no servidor e gera uma nova">Reset</button>
  </div>

  <!-- Cabeçalho -->
  <div class="header">
    <div>
      <h2>Affiore • Arte em Presentear</h2>
      <div style="font-size: 11px; opacity: 0.8;"><span class="status-dot"></span>Online</div>
    </div>
  </div>

  <!-- Mensagens -->
  <div class="messages-area" id="messagesArea">
    <div class="msg msg-system">Conectado ao canal de testes do agente</div>
  </div>

  <!-- Entrada de Texto -->
  <div class="input-area">
    <textarea id="userInput" placeholder="Digite uma mensagem..." maxlength="4000" onkeydown="handleKey(event)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  const messagesArea = document.getElementById('messagesArea');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const apiUrlInput = document.getElementById('apiUrl');
  const sessionIdInput = document.getElementById('sessionId');
  const authTokenInput = document.getElementById('authToken');

  // Espelha MAX_MENSAGEM_CARACTERES da API. Ao mudar lá, mude aqui.
  const LIMITE_MENSAGEM = 4000;
  // Aborta a requisição se o provedor demorar demais.
  const TIMEOUT_MS = 60000;

  function cabecalhos() {
    const h = { 'Content-Type': 'application/json' };
    const token = authTokenInput.value.trim();
    if (token) h['Authorization'] = 'Bearer ' + token;
    return h;
  }

  function baseUrl() {
    // "/chat" vira a raiz, para o DELETE de reset.
    return apiUrlInput.value.trim().replace(/\/+$/, '').replace(/\/chat$/, '');
  }

  function appendMessage(text, role) {
    const div = document.createElement('div');
    div.className = `msg ${role === 'user' ? 'msg-user' : (role === 'system' ? 'msg-system' : 'msg-bot')}`;
    // innerText, nunca innerHTML: a resposta do LLM nunca vira markup.
    div.innerText = text;
    messagesArea.appendChild(div);
    messagesArea.scrollTop = messagesArea.scrollHeight;
    return div;
  }

  function showThinking() {
    const div = appendMessage('Digitando…', 'bot');
    div.dataset.thinking = '1';
    div.style.opacity = '0.6';
  }

  function clearThinking() {
    messagesArea.querySelectorAll('[data-thinking]').forEach(el => el.remove());
  }

  function setBusy(busy) {
    userInput.disabled = busy;
    sendBtn.disabled = busy;
    if (!busy) userInput.focus();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  async function sendMessage() {
    const text = userInput.value.trim();

    if (!text) return;
    if (text.length > LIMITE_MENSAGEM) {
      appendMessage(`Mensagem muito longa (máximo de ${LIMITE_MENSAGEM} caracteres).`, 'system');
      return;
    }

    appendMessage(text, 'user');
    userInput.value = '';

    const apiUrl = apiUrlInput.value.trim();
    const sessionId = sessionIdInput.value.trim() || 'default_session';
    showThinking();
    setBusy(true);

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

    try {
      const res = await fetch(apiUrl, {
        method: 'POST',
        headers: cabecalhos(),
        signal: controller.signal,
        body: JSON.stringify({ message: text, session_id: sessionId })
      });

      clearThinking();

      if (res.status === 401) {
        appendMessage('Não autorizado: preencha o API token na barra acima.', 'system');
        return;
      }
      if (res.status === 429) {
        appendMessage('Limite de requisições atingido. Aguarde alguns instantes.', 'system');
        return;
      }
      if (!res.ok) {
        appendMessage(`Servidor respondeu ${res.status}.`, 'system');
        return;
      }

      const data = await res.json();

      // A ordem importa: em erro a API devolve response == "" , então testar
      // data.response antes de data.error esconderia o erro.
      if (data.error) {
        appendMessage(`Agente indisponível: ${data.error}`, 'system');
      } else if (data.response) {
        appendMessage(data.response, 'bot');
      } else {
        appendMessage('(sem resposta do agente)', 'system');
      }
    } catch (err) {
      clearThinking();
      const motivo = err.name === 'AbortError'
        ? `tempo limite de ${TIMEOUT_MS / 1000}s excedido`
        : err.message;
      appendMessage(`Falha de conexão: ${motivo}`, 'system');
    } finally {
      clearTimeout(timer);
      clearThinking();
      setBusy(false);
    }
  }

  async function resetSession() {
    const antiga = sessionIdInput.value.trim();
    const nova = 'sessao_' + Math.floor(Math.random() * 100000);

    // Limpa a memória no servidor antes de trocar de id — sem isso, a conversa
    // antiga continuaria ocupando espaço até o TTL expirar.
    if (antiga) {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 10000);
        await fetch(`${baseUrl()}/chat/${encodeURIComponent(antiga)}`, {
          method: 'DELETE',
          headers: cabecalhos(),
          signal: controller.signal
        });
        clearTimeout(timer);
      } catch (err) {
        appendMessage('Não foi possível limpar a sessão anterior no servidor.', 'system');
      }
    }

    sessionIdInput.value = nova;
    appendMessage(`Nova sessão: ${nova}`, 'system');
    userInput.focus();
  }
</script>

</body>
</html>
